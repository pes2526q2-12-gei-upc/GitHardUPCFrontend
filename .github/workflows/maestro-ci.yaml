name: Tests UI Frontend (Maestro)

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  maestro-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar codi
        uses: actions/checkout@v4
      - name: Habilitar KVM (Acceleració d'emulador d'Android)
        run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Donar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK de l'App
        run: ./gradlew assembleDebug

      - name: Executar Emulador i Tests Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            echo "Desactivant animacions per evitar errors de CI..."
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            
            echo "Instal·lant Maestro..."
            curl -Ls "https://get.maestro.mobile.dev" | bash
            
            echo "Instal·lant l'APK a l'emulador..."
            adb install app/build/outputs/apk/debug/app-debug.apk
            
            echo "Executant tests UI..."
            chmod +x $HOME/.maestro/bin/maestro
            $HOME/.maestro/bin/maestro test .maestro/

      - name: Pujar resultats de Maestro si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: ~/.maestro/tests/