appId: com.safesteps
name: Sanity Test
---
- launchApp:
    clearState: true
    permissions:
      location: allow

# 1. PANTALLA INICIAL
- assertVisible: ".*SafeSteps.*"

# 2. CONFIGURACIÓ DE RUTA

- extendedWaitUntil:
      visible:
          id: "input_desti"
      timeout: 10000

- tapOn:
    id: "input_desti"
- inputText: "Sagrada Familia, Barcelona"
- tapOn:
    text: "Sagrada Familia.*"
    index: 1

# Modificar Origen

- extendedWaitUntil:
      visible:
          id: "input_origen"
      timeout: 10000

- tapOn:
    id: "input_origen"
- inputText: "Cosmocaixa, Barcelona"
- tapOn:
    text: "CosmoCaixa.*"
    index: 1

# 3. CÀLCUL DE RUTA I INFO
- extendedWaitUntil:
    visible: ".*km|.*m"
    timeout: 10000

# 4. CANVI DE MODES DE RUTA

- extendedWaitUntil:
      visible:
          id: "btn_safety"
      timeout: 10000

- tapOn:
    id: "btn_safety"

- tapOn:
    id: "btn_clima"

- tapOn:
    id: "btn_accessibility"

# 5. INTERACCIONS DEL MAPA

- extendedWaitUntil:
      visible:
          id: "btn_satellit"
      timeout: 10000

- tapOn:
    id: "btn_satellit"
- tapOn:
    id: "btn_ubicacio_actual"